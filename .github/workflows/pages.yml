# Builds the static site and publishes it to GitHub Pages (ADR 0001):
#   /       the Lunar Site Viewer (viewer/): the front end, on the web app's data and science code
#   /app/   the team's original web app (web/), whose tests check the science against the Python results
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one but never cancels one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            viewer/package-lock.json
      - run: npm ci
      # Parity tests: the TypeScript science must match the committed Python results.
      - run: npm test
      # Typechecks, then builds web/dist/ with data/ and THIRD-PARTY-NOTICES.txt.
      - run: npm run build

      # Lunar Site Viewer, served at the site root. Its 3D terrain needs NASA elevation files (~180 MB);
      # they and the tiles cut from them are cached until the data script or the region list changes.
      - uses: actions/cache@v4
        with:
          path: |
            viewer/data-raw
            viewer/public/tiles
          key: viewer-nasa-tiles-${{ hashFiles('viewer/scripts/prepare-data.mjs', 'data/processed/site-data/regions.json') }}
      - run: npm ci --no-audit --no-fund
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # The web app uses relative paths, so it runs unchanged under /app/.
      - run: cp -r web/dist viewer/dist/app
        working-directory: .

      - uses: actions/upload-pages-artifact@v5
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
